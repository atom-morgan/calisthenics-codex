name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Database tests use in-memory PGlite: no database or secrets needed.
      - name: Test
        run: npm test

      # Env vars are validated at module load; placeholders satisfy that.
      # Nothing connects during the build. Real values live in Vercel.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          SUPABASE_URL: https://ci.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ci-placeholder
