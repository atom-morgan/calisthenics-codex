name: Keep alive

# Supabase pauses free projects after 7 days without database activity.
# /api/health runs a query, so pinging it every few days keeps the project up.
# Scheduled runs only happen on the default branch, and GitHub disables them
# after 60 days without commits (re-enable from the Actions tab).
on:
  schedule:
    - cron: "17 14 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Retries cover a cold start; a persistent failure fails the run, and
      # GitHub emails the repo owner.
      - run: >-
          curl --fail --silent --show-error --retry 3 --retry-delay 20
          --retry-all-errors https://calisthenics-codex.vercel.app/api/health
